<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ramen Post Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f0f;
    color: #eee;
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
    gap: 24px;
  }
  h1 { font-size: 10px; font-weight: 400; letter-spacing: 0.35em; color: #555; text-transform: uppercase; }
  .panel {
    background: #181818;
    border: 1px solid #252525;
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 420px;
  }
  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .field input[type="text"] {
    width: 100%;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #ddd;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    padding: 11px 12px;
    outline: none;
  }
  .upload-btn {
    display: block;
    width: 100%;
    background: #222;
    border: 1.5px dashed #3a3a3a;
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: #666;
    cursor: pointer;
    transition: background 0.2s;
  }
  .upload-btn:active { background: #2a2a2a; }
  .upload-btn input { display: none; }
  .upload-btn.loaded { color: #aaa; border-color: #555; border-style: solid; }
  .status { font-size: 11px; color: #555; text-align: center; min-height: 16px; }
  .status.ok { color: #4caf50; }
  .status.err { color: #f44336; }
  .dl-btn {
    display: block;
    background: #fff;
    color: #111;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .dl-btn.disabled { background: #1e1e1e; color: #3a3a3a; pointer-events: none; }
  .hint { font-size: 10px; color: #444; text-align: center; }
  .preview-wrap { width: 100%; max-width: 420px; }
  #previewCanvas { width: 100%; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); display: none; }
  .preview-placeholder {
    width: 100%;
    aspect-ratio: 4/5;
    background: #141414;
    border: 1px solid #1e1e1e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2a2a2a;
    font-size: 12px;
  }
</style>
</head>
<body>

<h1>Ramen Post Generator</h1>

<div class="panel">
  <div class="field">
    <label>画像（Border加工済み・4:5）</label>
    <label class="upload-btn" id="uploadBtn">
      📷 タップして画像を選択
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <div class="status" id="status"></div>
  </div>
  <div class="field">
    <label>ラーメン名（上部中央・空欄OK）</label>
    <input type="text" id="ramenName" placeholder="魚介豚骨つけ麺（並）">
  </div>
  <div class="field">
    <label>店名（下部右寄せ）</label>
    <input type="text" id="shopName" placeholder="麺処 さくら">
  </div>
  <div class="field">
    <label>住所・最寄り駅（最下部）</label>
    <input type="text" id="location" placeholder="東京都新宿区（新宿駅）">
  </div>
  <a id="dlBtn" class="dl-btn disabled">画像をアップロードしてください</a>
  <p class="hint" id="hint" style="display:none">※スマホは画像を長押し→保存 でもOK</p>
</div>

<div class="preview-wrap">
  <div class="preview-placeholder" id="placeholder">プレビュー</div>
  <canvas id="previewCanvas"></canvas>
</div>

<script>
  const fileInput  = document.getElementById('fileInput');
  const uploadBtn  = document.getElementById('uploadBtn');
  const statusEl   = document.getElementById('status');
  const ramenName  = document.getElementById('ramenName');
  const shopName   = document.getElementById('shopName');
  const locationEl = document.getElementById('location');
  const dlBtn      = document.getElementById('dlBtn');
  const canvas     = document.getElementById('previewCanvas');
  const placeholder= document.getElementById('placeholder');
  const hint       = document.getElementById('hint');
  const ctx        = canvas.getContext('2d');

  let loadedImg = null;

  fileInput.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) { setStatus('ファイルが選択されていません', 'err'); return; }
    setStatus('読み込み中...', '');
    const reader = new FileReader();
    reader.onerror = () => setStatus('読み込みエラー', 'err');
    reader.onload = function(e) {
      const img = new Image();
      img.onerror = () => setStatus('画像エラー', 'err');
      img.onload = function() {
        loadedImg = img;
        uploadBtn.classList.add('loaded');
        uploadBtn.childNodes[0].textContent = '✓ ' + file.name + ' （タップで変更）';
        setStatus('読み込み完了 ' + img.naturalWidth + '×' + img.naturalHeight, 'ok');
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  ['input', 'change'].forEach(ev => {
    [ramenName, shopName, locationEl].forEach(el => {
      el.addEventListener(ev, () => { if (loadedImg) render(); });
    });
  });

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  function detectBorderHeight(W, H) {
    const sampleX = Math.floor(W / 2);
    const data = ctx.getImageData(sampleX, 0, 1, H).data;
    let borderH = Math.floor(H * 0.1);
    for (let y = 0; y < Math.floor(H * 0.4); y++) {
      if (data[y*4] < 225 || data[y*4+1] < 225 || data[y*4+2] < 225) {
        borderH = Math.max(y, Math.floor(H * 0.07));
        break;
      }
    }
    return borderH;
  }

  // 文字幅を測って自動縮小するフォントサイズ計算
  function fitFontSize(text, maxWidth, baseFontSize, minFontSize, weight) {
    let fs = baseFontSize;
    ctx.font = `${weight} ${fs}px 'Noto Sans JP', sans-serif`;
    while (ctx.measureText(text).width > maxWidth && fs > minFontSize) {
      fs -= 1;
      ctx.font = `${weight} ${fs}px 'Noto Sans JP', sans-serif`;
    }
    return fs;
  }

  function render() {
    if (!loadedImg) return;
    const W = loadedImg.naturalWidth;
    const H = loadedImg.naturalHeight;
    canvas.width  = W;
    canvas.height = H;

    ctx.drawImage(loadedImg, 0, 0, W, H);

    const borderH = detectBorderHeight(W, H);
    const PAD = W * 0.025;
    const maxTextW = W * 0.88; // 左右に6%ずつ余白

    // ラーメン名 — 自動縮小・中央寄せ
    const ramen = ramenName.value.trim();
    if (ramen) {
      const baseFs = Math.round(W * 0.052);
      const minFs  = Math.round(W * 0.028);
      const fs = fitFontSize(ramen, maxTextW, baseFs, minFs, '400');
      ctx.font = `400 ${fs}px 'Noto Sans JP', sans-serif`;
      ctx.fillStyle = '#111111';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ramen, W / 2, borderH * 0.68);
    }

    const shopFs = Math.round(W * 0.060);
    const locFs  = Math.round(W * 0.038);
    const gap    = Math.round(W * 0.016);
    const bottomMargin = Math.round(borderH * 0.28);
    const locY   = H - bottomMargin;
    const shopY  = locY - locFs * 0.5 - gap - shopFs * 0.5 + Math.round(W * 0.008);

    const shop = shopName.value.trim();
    if (shop) {
      const fittedShopFs = fitFontSize(shop, W - PAD * 2, shopFs, Math.round(W * 0.028), '400');
      ctx.font = `400 ${fittedShopFs}px 'Noto Sans JP', sans-serif`;
      ctx.fillStyle = '#111111';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(shop, W - PAD, shopY);
    }

    const loc = locationEl.value.trim();
    if (loc) {
      ctx.font = `400 ${locFs}px 'Noto Sans JP', sans-serif`;
      ctx.fillStyle = '#111111';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(loc, W - PAD, locY);
    }

    placeholder.style.display = 'none';
    canvas.style.display = 'block';

    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
    dlBtn.href = dataUrl;
    dlBtn.setAttribute('download', 'ramen_post.jpg');
    dlBtn.textContent = 'ダウンロード（JPG）';
    dlBtn.classList.remove('disabled');
    hint.style.display = 'block';
  }
</script>
</body>
</html>
